<!-- 一時的なメール送信テスト画面 -->
{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>メール送信テスト</h2>

    <p>
        PythonAnywhereのWebアプリから、
        send_mail()のみを実行します。
    </p>

    {% if success_message %}
        <p style="color: green;">
            {{ success_message }}
        </p>
    {% endif %}

    {% if error_message %}
        <p style="color: red;">
            {{ error_message }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="test-email">
                受信先メールアドレス
            </label>

            <input type="email"
                   name="email"
                   id="test-email"
                   class="form-control"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary"
                style="width: 100%;">
            テストメールを送る
        </button>
    </form>
</div>
{% endblock %}
